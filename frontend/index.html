<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GetEzi</title>
  <link href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' rel='stylesheet' />
</head>

<body>
  <div id="root"></div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      document.body.innerHTML = '<div style="color:red; font-weight:bold; padding:20px; border:2px solid red; z-index:9999; position:fixed; top:0; left:0; width:100%; background:white; overflow:auto;"><h1>Startup Error!</h1><pre>' + message + '\n' + source + ':' + lineno + '</pre></div>';
    };
    window.onunhandledrejection = function(event) {
        document.body.innerHTML = '<div style="color:red; font-weight:bold; padding:20px; border:2px solid red; z-index:9999; position:fixed; top:0; left:0; width:100%; background:white; overflow:auto;"><h1>Unhandled Promise Rejection!</h1><pre>' + event.reason + '</pre></div>';
    };
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
